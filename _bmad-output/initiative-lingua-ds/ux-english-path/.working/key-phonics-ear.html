<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Key screen — UJ-5 Ear block — Paper Lamp</title>
<style>
/*
  EXPERIENCE sections: Key Flows › UJ-5 Ear; Voice and Tone (“Do you hear the difference?”);
  Component Patterns (play, Caption toggle, Yes/No, Input field, Mic);
  Inspiration & Anti-patterns (no aloud wrong); Foundation (sparse, static).
*/
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Iowan Old Style", "Apple Garamond", "Times New Roman", Times, serif;
  background: #E8E2D6;
  color: #2C2A26;
  padding: 32px 40px 64px;
  line-height: 1.6;
}
.page-note {
  max-width: 920px;
  margin: 0 auto 28px;
  font-size: 13px;
  color: #5C564C;
  text-align: center;
}
.modes {
  display: flex;
  flex-direction: column;
  gap: 48px;
  align-items: center;
}
.mode-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6B655C;
  margin-bottom: 12px;
  text-align: center;
}

.desktop {
  width: 920px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(44,42,38,0.1);
}
.desktop-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
}
.desktop-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: currentColor; opacity: 0.2;
}
.desktop-title {
  flex: 1;
  text-align: center;
  font-size: 12px;
  letter-spacing: 0.04em;
  opacity: 0.4;
}
.desktop-body {
  min-height: 560px;
  padding: 52px 80px 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  justify-content: center;
}

.light .desktop { background: #F7F3EC; color: #2C2A26; border: 1px solid #D9D2C6; }
.light .desktop-bar { background: #EDE6D8; color: #2C2A26; border-bottom: 1px solid #D9D2C6; }
.light .desktop-body {
  background: #F7F3EC;
  background-image: radial-gradient(ellipse 70% 50% at 50% 0%, #FBF8F2 0%, #F7F3EC 70%);
}
.light .question { color: #2C2A26; }
.light .status { color: #6B655C; }
.light .play {
  border: 1px solid #D9D2C6;
  background: #FBF8F2;
  color: #5C564C;
}
.light .caption-toggle { color: #6B655C; }
.light .choice { color: #2C2A26; }
.light .field {
  background: #FBF8F2;
  border: 1px solid #D9D2C6;
  color: #2C2A26;
}
.light .mic {
  border: 1px solid #D9D2C6;
  color: #5C564C;
  background: #FBF8F2;
}

.dark .desktop { background: #1C1A16; color: #E8E2D6; border: 1px solid #3A342C; }
.dark .desktop-bar { background: #12100C; color: #E8E2D6; border-bottom: 1px solid #3A342C; }
.dark .desktop-body {
  background: #1C1A16;
  background-image: radial-gradient(ellipse 60% 40% at 50% 0%, #24211C 0%, #1C1A16 75%);
}
.dark .question { color: #E8E2D6; }
.dark .status { color: #9A9286; }
.dark .play {
  border: 1px solid #3A342C;
  background: #24211C;
  color: #C8C0B2;
}
.dark .caption-toggle { color: #9A9286; }
.dark .choice { color: #E8E2D6; }
.dark .field {
  background: #24211C;
  border: 1px solid #3A342C;
  color: #E8E2D6;
}
.dark .mic {
  border: 1px solid #3A342C;
  color: #C8C0B2;
  background: #24211C;
}

.question {
  font-size: 18px;
  font-weight: 500;
  margin-bottom: 16px;
}
.status {
  font-size: 13px;
  margin-bottom: 36px;
  min-height: 1.3em;
}
.play-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 40px;
}
.play {
  width: 48px;
  height: 48px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 18px;
  cursor: default;
  line-height: 1;
}
.caption-toggle {
  font-size: 11px;
  letter-spacing: 0.02em;
  border: none;
  background: transparent;
  font-family: inherit;
  cursor: default;
  padding: 0;
}
.choices {
  display: flex;
  gap: 40px;
  justify-content: center;
  margin-bottom: 48px;
}
.choice {
  font-family: inherit;
  font-size: 15px;
  font-weight: 400;
  background: transparent;
  border: none;
  cursor: default;
  letter-spacing: 0.02em;
  padding: 4px 0;
}
.composer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  max-width: 480px;
  margin-top: auto;
}
.field {
  flex: 1;
  height: 40px;
  border-radius: 4px;
  padding: 0 14px;
  font-family: inherit;
  font-size: 15px;
  text-align: left;
}
.mic {
  width: 44px;
  height: 40px;
  border-radius: 4px;
  font-family: inherit;
  font-size: 13px;
  cursor: default;
  text-align: center;
}
</style>
</head>
<body>
  <p class="page-note">UJ-5 ear — almost empty; same/different after listen; one play. No right/wrong chrome.</p>

  <div class="modes">
    <section class="light">
      <div class="mode-label">Light</div>
      <div class="desktop">
        <div class="desktop-bar">
          <span class="desktop-dot"></span><span class="desktop-dot"></span><span class="desktop-dot"></span>
          <span class="desktop-title">English Path</span>
        </div>
        <div class="desktop-body">
          <div class="question">Same or different?</div>
          <div class="status">Playing…</div>
          <div class="play-wrap">
            <button class="play" type="button" aria-label="Play pair">◉</button>
            <button class="caption-toggle" type="button">Caption</button>
          </div>
          <div class="choices">
            <button class="choice" type="button">Same</button>
            <button class="choice" type="button">Different</button>
          </div>
          <div class="composer">
            <input class="field" type="text" value="" aria-label="input">
            <button class="mic" type="button" aria-label="microphone">◉</button>
          </div>
        </div>
      </div>
    </section>

    <section class="dark">
      <div class="mode-label">Dark</div>
      <div class="desktop">
        <div class="desktop-bar">
          <span class="desktop-dot"></span><span class="desktop-dot"></span><span class="desktop-dot"></span>
          <span class="desktop-title">English Path</span>
        </div>
        <div class="desktop-body">
          <div class="question">Same or different?</div>
          <div class="status">Playing…</div>
          <div class="play-wrap">
            <button class="play" type="button" aria-label="Play pair">◉</button>
            <button class="caption-toggle" type="button">Caption</button>
          </div>
          <div class="choices">
            <button class="choice" type="button">Same</button>
            <button class="choice" type="button">Different</button>
          </div>
          <div class="composer">
            <input class="field" type="text" value="" aria-label="input">
            <button class="mic" type="button" aria-label="microphone">◉</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
